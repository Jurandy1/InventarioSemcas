<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Inventário SEMCAS</title>
  </head>
  <body style="margin: 0">
    <!-- #region debug-point A:index-loaded -->
    <script type="module">
      const __dbg = (hypothesisId, msg, data) =>
        fetch("http://192.168.15.14:7777/event", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            sessionId: "white-screen-reload",
            runId: "pre",
            hypothesisId,
            location: "index.html",
            msg: "[DEBUG] " + msg,
            data: data || {},
            ts: Date.now(),
          }),
        }).catch(() => {});
      fetch("http://192.168.15.14:7777/event", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          sessionId: "white-screen-reload",
          runId: "pre",
          hypothesisId: "A",
          location: "index.html",
          msg: "[DEBUG] index.html carregou",
          data: { href: window.location.href },
          ts: Date.now(),
        }),
      }).catch(() => {});

      window.addEventListener(
        "error",
        (e) => {
          const t = e.target;
          if (t && (t.src || t.href)) {
            __dbg("C", "resource error", {
              tag: t.tagName,
              src: t.src || null,
              href: t.href || null,
            });
            return;
          }
          __dbg("C", "window error", {
            message: e.message || null,
            filename: e.filename || null,
            lineno: e.lineno || null,
            colno: e.colno || null,
          });
        },
        true,
      );

      window.addEventListener("unhandledrejection", (e) => {
        __dbg("C", "unhandledrejection", {
          reason: String(e.reason || ""),
        });
      });
    </script>
    <!-- #endregion -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx?v=20260524b"></script>
  </body>
</html>
