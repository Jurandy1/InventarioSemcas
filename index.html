<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1e3a8a" />
    <meta name="description" content="Sistema de Inventário SEMCAS" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='16' fill='%231e3a8a'/><text x='50' y='62' text-anchor='middle' font-size='42' font-weight='700' fill='white' font-family='system-ui'>S</text></svg>" />
    <link rel="stylesheet" href="/src/styles/global.css" />
    <title>Inventário SEMCAS</title>
    <style>
      /* Prevenir zoom desconfortável no mobile */
      input[type="text"],
      input[type="email"],
      input[type="number"],
      select,
      textarea {
        font-size: 16px;
      }

      /* Suporte para notches */
      body {
        padding-top: env(safe-area-inset-top, 0);
        padding-bottom: env(safe-area-inset-bottom, 0);
        padding-left: env(safe-area-inset-left, 0);
        padding-right: env(safe-area-inset-right, 0);
      }

      /* Scrollbar (somente Chromium/WebKit) */
      @supports selector(::-webkit-scrollbar) {
        ::-webkit-scrollbar {
          width: 8px;
          height: 8px;
        }

        ::-webkit-scrollbar-track {
          background: #f1f5f9;
        }

        ::-webkit-scrollbar-thumb {
          background: #cbd5e1;
          border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
          background: #94a3b8;
        }
      }

      /* Selection color */
      ::selection {
        background-color: #1e3a8a;
        color: #fff;
      }
    </style>
  </head>
  <body style="margin: 0">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
