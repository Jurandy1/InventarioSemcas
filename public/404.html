<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Inventário SEMCAS</title>
    <script>
      (function () {
        var segmentCount = 1;
        var l = window.location;
        var repo = l.pathname.split("/").slice(0, 1 + segmentCount).join("/");
        l.replace(l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") + repo + "/?/" + l.pathname.slice(1).split("/").slice(segmentCount).join("/").replace(/&/g, "~and~") + (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") + l.hash);
      })();
    </script>
  </head>
  <body></body>
</html>
